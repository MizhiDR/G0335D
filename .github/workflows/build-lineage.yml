name: Build LineageOS 14.1 (G0335D)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: LineageOS 14.1 / g0335d
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Configure Jack
        run: |
          # cm-14.1 uses Jack 4.8.ALPHA, which talks to its server over
          # TLSv1.  JDK 8u292+ disables TLSv1/TLSv1.1 by default, which
          # makes every jack-admin connection fail with "SSL error".
          JAVA_SEC="$JAVA_HOME/jre/lib/security/java.security"
          if [ -f "$JAVA_SEC" ]; then
            if ! sed -i 's/^jdk\.tls\.disabledAlgorithms=.*/jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL/' "$JAVA_SEC" 2>/dev/null; then
              sudo sed -i 's/^jdk\.tls\.disabledAlgorithms=.*/jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL/' "$JAVA_SEC"
            fi
            grep '^jdk.tls.disabledAlgorithms' "$JAVA_SEC"
          else
            echo "java.security not found at $JAVA_SEC"
          fi
          # The runner starts with a clean HOME, but be explicit.
          rm -rf "$HOME/.jack-server" "$HOME/.jack-settings"
          java -version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libncurses5 \
            libtinfo5 libsdl1.2-dev \
            libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop \
            pngcrush python2 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Repo init and sync
        run: |
          mkdir -p lineage
          cd lineage
          df -h /
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

      - name: Install device tree and kernel
        run: |
          cd "$GITHUB_WORKSPACE/lineage"
          mkdir -p device/gree kernel/gree
          cp -r "$GITHUB_WORKSPACE/device/gree/g0335d" device/gree/
          cp -r "$GITHUB_WORKSPACE/kernel/gree/msm8996" kernel/gree/
          if [ -d "$GITHUB_WORKSPACE/vendor/gree/g0335d/proprietary" ]; then
            mkdir -p vendor/gree
            cp -r "$GITHUB_WORKSPACE/vendor/gree/g0335d" vendor/gree/
          else
            mkdir -p vendor/gree
            git clone --depth=1 https://github.com/MizhiDR/vendor_gree_g0335d.git vendor/gree/g0335d
          fi

      - name: Sync device dependencies
        run: |
          cd "$GITHUB_WORKSPACE/lineage"
          # device/qcom/common is normally in the LineageOS manifest, but make
          # sure it exists because the device tree includes its sepolicy/display
          # helpers.
          if [ ! -d device/qcom/common ]; then
            git clone --depth=1 -b cm-14.1 \
              https://github.com/LineageOS/android_device_qcom_common.git \
              device/qcom/common || true
          fi
          # NXP NFC projects listed in cm.dependencies (not in every manifest).
          for spec in \
            "vendor/nxp-nfc/opensource/frameworks:android_vendor_nxp-nfc_opensource_frameworks" \
            "vendor/nxp-nfc/opensource/libnfc-nci:android_vendor_nxp-nfc_opensource_libnfc-nci" \
            "vendor/nxp-nfc/opensource/Nfc:android_vendor_nxp-nfc_opensource_Nfc"; do
            path="${spec%%:*}"
            repo="${spec##*:}"
            if [ ! -d "$path" ]; then
              git clone --depth=1 -b cm-14.1 \
                "https://github.com/LineageOS/$repo.git" "$path" || true
            fi
          done
          # Patch the NXP NFC tree for PN547C2 (see the script for details).
          python2 device/gree/g0335d/patches/fix_nxp_pn547.py

      - name: Build LineageOS 14.1
        run: |
          cd "$GITHUB_WORKSPACE/lineage"
          source build/envsetup.sh
          lunch lineage_g0335d-userdebug
          # Work around an old kati/find issue: some CM14.1 makefiles run
          # "find" on this intermediates dir before it is created.
          mkdir -p out/target/common/obj/SHARED_LIBRARIES/libwifi-hal-mock_intermediates
          # This device ships a prebuilt stock kernel, so the usual
          # KERNEL_OBJ/usr headers_install step does not exist.  Platform
          # modules such as libsdcard depend on it and include <linux/fuse.h>.
          test -n "$OUT"
          rm -rf "$OUT/obj/KERNEL_OBJ/usr"
          mkdir -p "$OUT/obj/KERNEL_OBJ"
          cp -r device/gree/g0335d/kernel-headers "$OUT/obj/KERNEL_OBJ/usr"
          # frameworks/base only pre-creates the 64-bit export_includes for
          # libtime_genoff; do the 32-bit one as well.
          for arch_dir in "$OUT/obj" "$OUT/obj_arm"; do
            mkdir -p "$arch_dir/SHARED_LIBRARIES/libtime_genoff_intermediates"
            touch "$arch_dir/SHARED_LIBRARIES/libtime_genoff_intermediates/export_includes"
          done
          export WITH_DEXPREOPT=false
          export LC_ALL=C
          # Compile the NXP NFC JNI early: it is the most device-specific
          # component and the quickest place to catch PN547C2 issues.
          mka libnqnfc_nci_jni -j4
          # cm-14.1's CMSDK makefile has a missing dependency: the
          # org.cyanogenmod.platform.internal javac step runs before
          # org.cyanogenmod.platform-res has generated R.java/Manifest.java.
          # Build the resource package explicitly first.
          mka org.cyanogenmod.platform-res -j4
          mka bacon -j4

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          PRODUCT_OUT="$GITHUB_WORKSPACE/lineage/out/target/product/g0335d"
          cp "$PRODUCT_OUT"/*.zip "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp "$PRODUCT_OUT"/*.img "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp "$PRODUCT_OUT"/*.txt  "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-14.1-g0335d
          path: artifacts/
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            lineage/out/verbose.log.gz
            lineage/out/error.log
            /home/runner/.jack-server/logs/
          if-no-files-found: ignore
